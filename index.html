<body>

<div id="app"></div>
<div id="modalRoot"></div>

<script>
/* =====================================================================
   حالة التطبيق والتوجيه
   ===================================================================== */
let currentUser = null;
let currentRestaurant = null; // بيانات المطعم لصاحب الحساب الحالي (Dashboard)
let dashState = { tab:'items', selectedCategoryId:null };
let publicRestaurant = null; // بيانات المطعم لصفحة الزبون
let publicMenuState = { search:'', activeCat:'all' };

const params = new URLSearchParams(location.search);
const routeSlug = params.get('r');
const routeTable = params.get('table');

function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
function toast(msg){
  const t = el(`<div class="toast">${escapeHTML(msg)}</div>`);
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2600);
}
function escapeHTML(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtPrice(n){ return (Math.round(Number(n)*100)/100).toLocaleString('ar'); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function slugify(name){
  const base = String(name).trim().toLowerCase()
    .replace(/[^a-z0-9\u0600-\u06FF\s-]/g,'')
    .replace(/\s+/g,'-').slice(0,40) || 'restaurant';
  return base + '-' + Math.random().toString(36).slice(2,6);
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
function openModal(innerHTML){
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this) closeModal()">
      <div class="modal">${innerHTML}</div>
    </div>`;
}

/* =====================================================================
   Supabase Storage — رفع الصور
   ===================================================================== */
async function uploadToCloudinary(file, onProgress){
  if(!_sb){ toast('لازم تربط حساب Supabase أولاً بالإعدادات بأعلى الملف'); return null; }
  try{
    const path = `${(currentRestaurant&&currentRestaurant.id)||'public'}/${Date.now()}_${uid()}_${file.name}`;
    const { error } = await _sb.storage.from(SUPABASE_BUCKET).upload(path, file, { upsert:false });
    if(error){ console.error(error); toast('تعذّر رفع الصورة'); return null; }
    const { data } = _sb.storage.from(SUPABASE_BUCKET).getPublicUrl(path);
    return data && data.publicUrl ? data.publicUrl : null;
  }catch(e){
    console.error('upload failed', e);
    toast('تعذّر رفع الصورة');
    return null;
  }
}
function wireImageUpload(inputId, previewId, onDone){
  document.getElementById(inputId).addEventListener('change', async (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const prev = document.getElementById(previewId);
    prev.innerHTML = `<div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--muted);">⏳ جاري الرفع...</div>` + prev.innerHTML;
    const url = await uploadToCloudinary(file);
    if(url) onDone(url);
  });
}

/* =====================================================================
   Firestore — طبقة البيانات
   بنية القاعدة:
   restaurants/{id}                  بيانات المطعم العامة
   restaurants/{id}/categories/{id}  الأقسام
   restaurants/{id}/items/{id}       الأصناف
   restaurants/{id}/tables/{id}      الطاولات
   ===================================================================== */
function db(){ return _db; }

async function createRestaurant(ownerUid, name){
  const slug = slugify(name);
  const ref = db().collection('restaurants').doc();
  const data = {
    ownerId: ownerUid, name, slug, logoUrl:'', coverUrl:'',
    primaryColor:'#2B1A12', accentColor:'#C67C2E',
    createdAt: Date.now()
  };
  await ref.set(data);
  const defaultCats = ['المقبلات','الوجبات الرئيسية','المشروبات'];
  for(const c of defaultCats){
    await ref.collection('categories').add({ name:c, order:Date.now(), active:true });
  }
  return { id: ref.id, ...data };
}
async function getRestaurantByOwner(ownerUid){
  const snap = await db().collection('restaurants').where('ownerId','==',ownerUid).limit(1).get();
  if(snap.empty) return null;
  const d = snap.docs[0];
  return { id:d.id, ...d.data() };
}
async function getRestaurantBySlug(slug){
  const snap = await db().collection('restaurants').where('slug','==',slug).limit(1).get();
  if(snap.empty) return null;
  const d = snap.docs[0];
  return { id:d.id, ...d.data() };
}
async function saveRestaurant(id, patch){
  await db().collection('restaurants').doc(id).set(patch, {merge:true});
}
async function listSub(restId, coll){
  const snap = await db().collection('restaurants').doc(restId).collection(coll).orderBy('order','asc').get().catch(async ()=>{
    return await db().collection('restaurants').doc(restId).collection(coll).get();
  });
  return snap.docs.map(d=>({id:d.id, ...d.data()}));
}
async function addSub(restId, coll, data){
  data.order = data.order ?? Date.now();
  const ref = await db().collection('restaurants').doc(restId).collection(coll).add(data);
  return { id: ref.id, ...data };
}
async function updateSub(restId, coll, id, patch){
  await db().collection('restaurants').doc(restId).collection(coll).doc(id).set(patch, {merge:true});
}
async function deleteSub(restId, coll, id){
  await db().collection('restaurants').doc(restId).collection(coll).doc(id).delete();
}

async function doSignup(){
  const name = document.getElementById('suRestName').value.trim();
  const email = document.getElementById('suEmail').value.trim();
  const pass = document.getElementById('suPass').value;
  if(!name || !email || pass.length<6){ toast('عبّي كل الحقول (كلمة المرور 6 أحرف فأكثر)'); return; }
  try{
    const cred = await _auth.createUserWithEmailAndPassword(email, pass);
    const rest = await createRestaurant(cred.user.uid, name);
    currentRestaurant = rest;
    toast('تم إنشاء حسابك بنجاح 🎉');
    renderApp();
  }catch(e){ toast(authErr(e)); }
}
async function doLogin(){
  const email = document.getElementById('liEmail').value.trim();
  const pass = document.getElementById('liPass').value;
  try{
    await _auth.signInWithEmailAndPassword(email, pass);
  }catch(e){ toast(authErr(e)); }
}
async function completeRestaurantSetup(){
  const name = document.getElementById('fixRestName').value.trim();
  if(!name){ toast('اكتب اسم المطعم'); return; }
  try{
    const rest = await createRestaurant(currentUser.uid, name);
    currentRestaurant = rest;
    toast('تم إنشاء حسابك بنجاح 🎉');
    renderApp();
  }catch(e){
    console.error(e);
    toast('صار خطأ: ' + (e.code || e.message || 'غير معروف'));
  }
}
function authErr(e){
  const map = {
    'auth/email-already-in-use':'هذا البريد مسجّل من قبل',
    'auth/invalid-email':'صيغة البريد غير صحيحة',
    'auth/weak-password':'كلمة المرور ضعيفة',
    'auth/user-not-found':'ما فيه حساب بهذا البريد',
    'auth/wrong-password':'كلمة المرور غير صحيحة',
    'auth/invalid-credential':'بيانات الدخول غير صحيحة',
  };
  return map[e.code] || ('صار خطأ: ' + (e.code || e.message || 'غير معروف'));
}
function doLogout(){ _auth.signOut(); }

async function boot(){
  if(routeSlug){
    // صفحة الزبون العامة
    publicRestaurant = await getRestaurantBySlug(routeSlug);
    renderApp();
    return;
  }
  if(!_auth){ renderApp(); return; }
  _auth.onAuthStateChanged(async (user)=>{
    currentUser = user;
    if(user){
      currentRestaurant = await getRestaurantByOwner(user.uid);
    } else {
      currentRestaurant = null;
    }
    renderApp();
  });
}

function renderApp(){
  const app = document.getElementById('app');
  if(routeSlug){

  if(currentUser && currentRestaurant){

    app.innerHTML = `

    <input type="text" id="itemAddons" value="${escapeHTML(addons.map(a=>a.name+':'+a.price).join(', '))}" placeholder="اسم:سعر, اسم:سعر">
    <button class="btn btn-primary btn-block" style="margin-top:18px;" onclick="saveItem('${id||''}')">حفظ الصنف</button>
  `);

  wireImageUpload('itemImgInput','itemImgWrap',(url)=>{

  });

async function saveItem(id){
  const name = document.getElementById('itemName').value.trim();
  const price = parseFloat(document.getElementById('itemPrice').value);
  const categoryId = document.getElementById('itemCat').value;
  const description = document.getElementById('itemDesc').value.trim();
  const addonsRaw = document.getElementById('itemAddons').value.trim();
  const imageUrl = window._pendingItemImage ? window._pendingItemImage() : '';
  if(!name || isNaN(price)){ toast('اكتب اسم الصنف والسعر بشكل صحيح'); return; }
  const addons = addonsRaw ? addonsRaw.split(',').map(s=>{
    const [n,p] = s.split(':'); return { name:(n||'').trim(), price: parseFloat(p)||0 };
  }).filter(a=>a.name) : [];
  const data = { name, price, categoryId, description, imageUrl, addons };
  if(id) await updateSub(currentRestaurant.id,'items',id,data);
  else await addSub(currentRestaurant.id,'items',{...data, active:true});
  closeModal(); toast('تم حفظ الصنف ✅'); renderDashboardTab();
}

/* ---------------- الطاولات و QR ---------------- */
async function renderTablesTab(body){
  body.innerHTML = `<div class="card" style="text-align:center;">جاري التحميل...</div>`;
  const tables = await listSub(currentRestaurant.id,'tables');
  if(!tables.length){
    body.innerHTML = emptyState('🔗','ما فيه طاولات بعد','أضف طاولاتك عشان تولّد لكل وحدة QR Code خاص فيها');
  } else {
    body.innerHTML = `<div class="note" style="margin-bottom:14px;">امسح الكود بجوالك للتجربة، أو اضغط "تحميل" لطباعته على الطاولة.</div>` +
      tables.map(t=>{
        const menuUrl = `${location.origin}${location.pathname}?r=${currentRestaurant.slug}&table=${encodeURIComponent(t.number)}`;
        return `<div class="qr-card">
          <div id="qr-${t.id}"></div>
          <h4>طاولة ${escapeHTML(String(t.number))}</h4>
          <div class="url">${menuUrl}</div>
          <div class="qr-actions">
            <button class="btn btn-ghost btn-sm" onclick="downloadQR('${t.id}','${escapeHTML(String(t.number))}')">⬇️ PNG</button>
            <button class="btn btn-ghost btn-sm" onclick="downloadQRPDF('${t.id}','${escapeHTML(String(t.number))}')">⬇️ PDF</button>
            <button class="icon-btn" onclick="removeTable('${t.id}')">🗑️</button>
          </div>
        </div>`;
      }).join('');
  }
  body.innerHTML += `<div style="height:70px;"></div>`;
  ensureFab('+ طاولة جديدة', ()=>addTable());
  // ترسم أكواد الـ QR بعد إضافتها للـ DOM
  for(const t of tables){
    const menuUrl = `${location.origin}${location.pathname}?r=${currentRestaurant.slug}&table=${encodeURIComponent(t.number)}`;
    const holder = document.getElementById(`qr-${t.id}`);
    if(holder) new QRCode(holder, { text: menuUrl, width:150, height:150, colorDark:'#241C14', colorLight:'#ffffff' });
  }
}
async function addTable(){
  const num = prompt('رقم أو اسم الطاولة (مثال: 5 أو VIP1):');
  if(!num) return;
  await addSub(currentRestaurant.id,'tables',{ number:num.trim() });
  toast('تمت إضافة الطاولة ✅'); renderDashboardTab();
}
async function removeTable(id){
  if(!confirm('حذف هذي الطاولة؟')) return;
  await deleteSub(currentRestaurant.id,'tables',id);
  toast('تم الحذف'); renderDashboardTab();
}
function downloadQR(tableId, num){
  const canvas = document.querySelector(`#qr-${tableId} canvas`);
  if(!canvas){ toast('تعذّر تجهيز الصورة'); return; }
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = `table-${num}-qr.png`;
  a.click();
}
function downloadQRPDF(tableId, num){
  const canvas = document.querySelector(`#qr-${tableId} canvas`);
  if(!canvas || !window.jspdf){ toast('تعذّر تجهيز الملف'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'mm', format:[100,120] });
  const img = canvas.toDataURL('image/png');
  doc.setFont('helvetica','bold');
  doc.setFontSize(16);
  doc.text(`Table ${num}`, 50, 20, { align:'center' });
  doc.addImage(img, 'PNG', 20, 28, 60, 60);
  doc.setFontSize(10);
  doc.text(`${currentRestaurant.name}`, 50, 100, { align:'center' });
  doc.save(`table-${num}-qr.pdf`);
}

/* ---------------- إعدادات المطعم ---------------- */
async function renderSettingsTab(body){
  const r = currentRestaurant;
  const colors = ['#C67C2E','#748C55','#B3432B','#2B6E8C','#8C5EA8','#2B1A12'];
  body.innerHTML = `
    <div class="card">
      <div class="eyebrow">هوية المطعم</div>
      <label>شعار المطعم</label>
      <div class="img-upload" id="logoWrap" style="aspect-ratio:1/1; max-width:120px;">
        ${r.logoUrl?`<img src="${r.logoUrl}">`:`<span>📷 شعار</span>`}
        <input type="file" accept="image/*" id="logoInput">
      </div>
      <label>صورة الغلاف</label>
      <div class="img-upload" id="coverWrap">
        ${r.coverUrl?`<img src="${r.coverUrl}">`:`<span>📷 صورة الغلاف</span>`}
        <input type="file" accept="image/*" id="coverInput">
      </div>
      <label>اسم المطعم</label>
      <input type="text" id="setName" value="${escapeHTML(r.name)}">
      <label>لون هوية المنيو</label>
      <div class="color-swatches">
        ${colors.map(c=>`<button class="swatch ${r.accentColor===c?'active':''}" style="background:${c}" onclick="pickColor('${c}')"></button>`).join('')}
      </div>
      <button class="btn btn-primary btn-block" style="margin-top:18px;" onclick="saveSettings()">حفظ الإعدادات</button>
    </div>
    <div class="card">
      <div class="eyebrow">رابط منيو مطعمك</div>
      <p style="font-size:13px; word-break:break-all; margin-bottom:10px;">${location.origin}${location.pathname}?r=${r.slug}</p>
      <button class="btn btn-ghost btn-block" onclick="navigator.clipboard.writeText('${location.origin}${location.pathname}?r=${r.slug}'); toast('تم نسخ الرابط')">نسخ الرابط</button>
    </div>
    <div style="height:30px;"></div>
  `;
  wireImageUpload('logoInput','logoWrap', async (url)=>{ await saveRestaurant(r.id,{logoUrl:url}); r.logoUrl=url; toast('تم تحديث الشعار'); });
  wireImageUpload('coverInput','coverWrap', async (url)=>{ await saveRestaurant(r.id,{coverUrl:url}); r.coverUrl=url; toast('تم تحديث الغلاف'); });
  removeFab();
}
async function pickColor(c){
  currentRestaurant.accentColor = c;
  await saveRestaurant(currentRestaurant.id, {accentColor:c});
  renderDashboardTab();
}
async function saveSettings(){
  const name = document.getElementById('setName').value.trim();
  if(!name){ toast('اكتب اسم المطعم'); return; }
  await saveRestaurant(currentRestaurant.id, {name});
  currentRestaurant.name = name;
  toast('تم حفظ الإعدادات ✅');
  renderApp();
}

/* ---------------- عناصر مساعدة للوحة التحكم ---------------- */
function emptyState(icon,title,desc){
  return `<div class="empty-state"><div class="ic">${icon}</div><h4>${title}</h4><p>${desc}</p></div>`;
}
function ensureFab(label, onClick){
  removeFab();
  const fab = el(`<button class="fab" id="dashFab">${label}</button>`);
  fab.onclick = onClick;
  document.body.appendChild(fab);
}
function removeFab(){ const f=document.getElementById('dashFab'); if(f) f.remove(); }

/* =====================================================================
   منيو الزبون — الصفحة العامة
   ===================================================================== */
function renderPublicMenu(){
  if(!publicRestaurant){
    return `<div class="auth-wrap"><div class="card" style="text-align:center;"><h3>ما لقينا هذا المنيو 😕</h3><p class="note">تأكد من الرابط أو تواصل مع المطعم.</p></div></div>`;
  }
  const r = publicRestaurant;
  document.documentElement.style.setProperty('--accent', r.accentColor || '#C67C2E');
  document.documentElement.style.setProperty('--primary', r.primaryColor || '#2B1A12');
  return `
    <div class="m-cover">
      ${r.coverUrl?`<img src="${r.coverUrl}">`:''}
      <div class="shade"></div>
    </div>
    <div class="m-header">
      <div class="m-logo">${r.logoUrl?`<img src="${r.logoUrl}">`:escapeHTML((r.name||'م')[0])}</div>
      <div class="m-title">${escapeHTML(r.name)}</div>
      ${routeTable?`<div class="m-table-chip">🍽️ طاولة ${escapeHTML(routeTable)}</div>`:''}
    </div>
    <div class="m-search">
      <input type="text" id="menuSearch" placeholder="🔍 دوّر عن صنف...">
    </div>
    <div class="m-cats" id="menuCats"></div>
    <div id="menuList"></div>
    <div style="height:30px;"></div>
  `;
}
async function wirePublicMenu(){
  if(!publicRestaurant) return;
  const r = publicRestaurant;
  const [cats, items] = await Promise.all([listSub(r.id,'categories'), listSub(r.id,'items')]);
  const visibleCats = cats.filter(c=>c.active!==false);
  const visibleItems = items.filter(i=>i.active!==false);

  document.getElementById('menuCats').innerHTML =
    `<button class="m-cat-btn ${publicMenuState.activeCat==='all'?'active':''}" onclick="setPublicCat('all')">الكل</button>` +
    visibleCats.map(c=>`<button class="m-cat-btn ${publicMenuState.activeCat===c.id?'active':''}" onclick="setPublicCat('${c.id}')">${escapeHTML(c.name)}</button>`).join('');

  function draw(){
    const q = publicMenuState.search.trim().toLowerCase();
    let list = visibleItems;
    if(publicMenuState.activeCat!=='all') list = list.filter(i=>i.categoryId===publicMenuState.activeCat);
    if(q) list = list.filter(i=> (i.name||'').toLowerCase().includes(q) || (i.description||'').toLowerCase().includes(q));

    let html = '';
    if(!list.length){
      html = emptyState('🔍','ما لقينا أصناف','جرب كلمة بحث ثانية أو اختر قسم آخر');
    } else if(publicMenuState.activeCat==='all' && !q){
      for(const c of visibleCats){
        const catItems = list.filter(i=>i.categoryId===c.id);
        if(!catItems.length) continue;
        html += `<div class="m-cat-heading">${escapeHTML(c.name)}</div>`;
        html += catItems.map(itemRow).join('');
      }
    } else {
      html = list.map(itemRow).join('');
    }
    document.getElementById('menuList').innerHTML = html;
  }
  function itemRow(i){
    return `<div class="m-item" onclick="openItemSheet('${i.id}')">
      ${i.imageUrl?`<img src="${i.imageUrl}">`:`<div class="ph">🍲</div>`}
      <div class="info">
        <h4>${escapeHTML(i.name)}</h4>
        <div class="desc">${escapeHTML(i.description||'')}</div>
        <div class="price">${fmtPrice(i.price)}</div>
        ${(i.addons&&i.addons.length)?`<span class="addons-tag">إضافات متاحة</span>`:''}
      </div>
    </div>`;
  }
  window._publicItems = visibleItems;
  window._publicCats = visibleCats;
  draw();
  document.getElementById('menuSearch').addEventListener('input', (e)=>{ publicMenuState.search = e.target.value; draw(); });
  window._drawPublicMenu = draw;
}
function setPublicCat(id){ publicMenuState.activeCat = id; if(window._drawPublicMenu) window._drawPublicMenu();
  document.querySelectorAll('.m-cat-btn').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
}
function openItemSheet(id){
  const i = (window._publicItems||[]).find(x=>x.id===id);
  if(!i) return;
  openModal(`
    <div class="modal-head"><h3>${escapeHTML(i.name)}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    ${i.imageUrl?`<img class="item-sheet-img" src="${i.imageUrl}">`:''}
    <p style="font-size:14px; color:var(--muted); line-height:1.8; margin-bottom:14px;">${escapeHTML(i.description||'')}</p>
    <div style="font-family:Cairo,sans-serif; font-weight:900; font-size:19px; color:var(--accent-ink); margin-bottom:14px;">${fmtPrice(i.price)}</div>
    ${(i.addons&&i.addons.length)?`
      <div class="opt-group">
        <h5>إضافات اختيارية</h5>
        ${i.addons.map(a=>`<div class="opt-choice"><span>${escapeHTML(a.name)}</span><span>${a.price>0?'+'+fmtPrice(a.price):'مجاناً'}</span></div>`).join('')}
      </div>` : ''}
  `);
}

/* =====================================================================
   بدء التشغيل
   ===================================================================== */
boot();
</script>
</body>
</html>
